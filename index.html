<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#5a0808">
<title>ManU Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#3a0505;overscroll-behavior:none;overflow:hidden}
body{font-family:Nunito,system-ui,sans-serif;font-weight:600;color:#fff;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:10px 14px 12px;
 background:radial-gradient(circle at 50% 0,#8a1010,#5a0808 60%);overflow:hidden;position:relative}
#app.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-9px) rotate(-.6deg)}40%{transform:translateX(9px) rotate(.6deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
h1,h2,.big,.btn,.who{font-family:"Lilita One",Impact,sans-serif;font-weight:400;letter-spacing:.5px}
#h1{font-size:30px;color:#ffd21f;text-align:center;line-height:1;text-shadow:0 3px 0 #1a1010}
#h2{font-size:13px;text-align:center;opacity:.85;margin:3px 0 7px}
#stats{display:flex;gap:8px}
.st{flex:1;text-align:center;font-size:11px;font-weight:800;position:relative}
.bar{height:12px;border-radius:7px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;width:50%;border-radius:7px;transition:width .5s cubic-bezier(.3,1.6,.5,1)}
.st em{position:absolute;left:0;right:0;top:26px;font-style:normal;font-size:14px;font-weight:800;opacity:0;pointer-events:none}
.st em.go{animation:pop 1.8s}
@keyframes pop{0%{opacity:0;transform:translateY(6px) scale(.6)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#face{width:100%;height:118px;flex:none;margin-top:6px}
#panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px;overflow-y:auto;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.card{background:#fff4dc;color:#1a1010;border:4px solid #1a1010;border-bottom-width:8px;border-radius:20px;padding:13px 15px;text-align:center;
 font-size:17px;line-height:1.3;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px;overflow-y:auto}
.card.slim{flex:none}
.who{color:#b01515;font-size:15px;text-transform:uppercase}
.card p{margin:0}.match{font-size:15px;background:#1a1010;color:#ffd21f;border-radius:12px;padding:8px 10px}
.btn{display:block;width:100%;border:4px solid #1a1010;border-bottom-width:8px;border-radius:17px;background:#ffd21f;color:#1a1010;
 font-size:19px;padding:13px 10px;min-height:58px;cursor:pointer;transition:transform .08s;flex:none;touch-action:manipulation}
.btn.w{background:#fff}.btn.g{background:#7ee08a}
.btn:active{transform:translateY(4px);border-bottom-width:4px;margin-bottom:4px}
.btn[disabled]{opacity:.5}
#toast{position:absolute;left:50%;top:128px;transform:translate(-50%,-50%) scale(0) rotate(-4deg);background:#1a1010;color:#ffd21f;border:3px solid #ffd21f;
 border-radius:16px;padding:10px 14px;font-size:16px;font-weight:800;text-align:center;width:82%;pointer-events:none;transition:transform .25s cubic-bezier(.3,1.7,.5,1);z-index:9}
#toast.on{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}
/* formation */
.pitch{position:relative;flex:1;min-height:210px;border:4px solid #1a1010;border-radius:16px;overflow:hidden;touch-action:none;
 background:repeating-linear-gradient(#2f9e4b 0 12.5%,#2a9044 12.5% 25%)}
.pitch:before{content:"";position:absolute;inset:6px;border:2px solid rgba(255,255,255,.55);border-radius:6px}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border:2px solid rgba(255,255,255,.55);border-radius:50%;box-shadow:0 0 0 0 #fff}
.half{position:absolute;left:6px;right:6px;top:50%;border-top:2px solid rgba(255,255,255,.55)}
.zone{position:absolute;left:10px;font-size:10px;font-weight:800;opacity:.6;letter-spacing:1px}
.dot{position:absolute;width:38px;height:38px;margin:-19px;border-radius:50%;background:#d81e1e;border:3px solid #1a1010;color:#fff;font:400 15px "Lilita One",sans-serif;
 display:flex;align-items:center;justify-content:center;transition:left .7s cubic-bezier(.4,1.5,.5,1),top .7s cubic-bezier(.4,1.5,.5,1);touch-action:none;cursor:grab;z-index:2}
.dot.drag{transition:none;transform:scale(1.25);z-index:5;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.dot.gk{background:#ffd21f;color:#1a1010}
.fline{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800}
.fline b{font:400 22px "Lilita One",sans-serif;color:#ffd21f}
/* transfers */
.tgt{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#ffe98a,#ffd21f 50%,#e0a800);color:#1a1010;border:4px solid #1a1010;border-bottom-width:7px;
 border-radius:16px;padding:9px 12px;text-align:left;cursor:pointer;flex:none}
.tgt .r{font:400 30px "Lilita One",sans-serif;width:46px;text-align:center}
.tgt small{display:block;font-size:12px;opacity:.75}.tgt .p{margin-left:auto;font:400 17px "Lilita One",sans-serif}
.steps{text-align:left;font-size:16px;font-weight:800}.steps div{opacity:0;transform:translateX(-10px);transition:.3s;margin:5px 0}.steps div.on{opacity:1;transform:none}
.hwg{font:400 34px "Lilita One",sans-serif;color:#b01515;animation:wob .5s infinite alternate}
@keyframes wob{from{transform:rotate(-4deg) scale(.95)}to{transform:rotate(4deg) scale(1.08)}}
.dud{background:#b8b0a0;border-radius:14px;padding:10px;border:3px dashed #1a1010}
.dud .r{font:400 40px "Lilita One",sans-serif;color:#b01515;line-height:1}
/* press */
.q{font-size:16px}
.ans{display:flex;flex-direction:column;gap:8px;flex:none}
.sens{transition:transform .2s,opacity .2s}.sens.wig{animation:wig .3s}
@keyframes wig{30%{transform:translateX(-30px) rotate(-8deg)}70%{transform:translateX(30px) rotate(8deg)}}
/* sub */
.pl{display:flex;align-items:center;gap:8px;background:#fff;color:#1a1010;border:3px solid #1a1010;border-bottom-width:6px;border-radius:14px;padding:8px 11px;font-size:15px;font-weight:800;cursor:pointer;flex:none}
.pl b{font:400 20px "Lilita One",sans-serif;width:34px}.pl span{margin-left:auto;white-space:nowrap;font-size:12px;background:#d81e1e;color:#fff;border-radius:8px;padding:3px 7px}
.led{background:#111;border:5px solid #333;border-radius:14px;color:#ff3b30;font:400 74px "Lilita One",monospace;line-height:1;padding:8px 0;text-shadow:0 0 14px #ff3b30;letter-spacing:4px}
.led small{display:block;font-size:16px;color:#3bff6a;text-shadow:0 0 8px #3bff6a;letter-spacing:1px}
/* var */
.var{position:relative;height:150px;flex:none;border:4px solid #1a1010;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(90deg,#2f9e4b 0 10%,#2a9044 10% 20%)}
.var .ln{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#ffd21f;box-shadow:0 0 0 2px rgba(0,0,0,.35);transition:left .08s linear}
.var .ln.auto{transition:left 1.1s cubic-bezier(.5,-.4,.3,1.4)}
.var .m{position:absolute;width:30px;height:30px;margin:-15px;border-radius:50%;border:3px solid #1a1010;top:50%;transition:left .08s linear}
.var .at{background:#d81e1e;top:36%}.var .df{background:#6cc8ff;top:80%}
.var .tag{position:absolute;font-size:10px;font-weight:800;background:#1a1010;border-radius:6px;padding:1px 5px;transform:translate(-50%,-34px);white-space:nowrap}
input[type=range]{width:100%;height:40px;accent-color:#ffd21f;flex:none}
/* talk */
.meter{position:relative;height:44px;flex:none;border:4px solid #1a1010;border-radius:14px;overflow:hidden;background:linear-gradient(90deg,#6cc8ff,#fff 50%,#ff5a3c)}
.meter .zn{position:absolute;top:0;bottom:0;background:rgba(60,220,100,.9);border-left:3px solid #1a1010;border-right:3px solid #1a1010;transition:left .12s}
.meter .nd{position:absolute;top:-4px;bottom:-4px;width:8px;margin-left:-4px;background:#1a1010;border-radius:4px}
.lab{display:flex;justify-content:space-between;font-size:11px;font-weight:800;opacity:.85}
.sack{font:400 44px "Lilita One",sans-serif;color:#b01515;line-height:1;animation:wob .6s infinite alternate}
</style>
</head>
<body>
<div id="app">
  <div id="h1">ManU MANAGER</div>
  <div id="h2"></div>
  <div id="stats"></div>
  <canvas id="face"></canvas>
  <div id="panel"></div>
  <div id="toast"></div>
</div>
<script>
const D={"EVENTS": [{"who": "THE BOARD (3 men in 1 trenchcoat)", "text": "We have £200m to spend. We'd like to spend it on a winger we saw in a 40-second compilation video with dubstep.", "a": {"label": "Sign him. The dubstep slaps.", "fx": {"board": 12, "squad": -8, "fans": 4}, "out": "He arrives. He cannot kick with either foot. Shirt sales are incredible."}, "b": {"label": "Ask for a defender instead", "fx": {"board": -12, "squad": 6}, "out": "The trenchcoat wobbles angrily. You get a 34-year-old on loan from a pub team."}}, {"who": "STAR STRIKER", "text": "Gaffer, I can't train today. My hairdresser says my fringe needs 48 hours to settle.", "a": {"label": "Respect the fringe", "fx": {"squad": 6, "fans": -6, "press": -5}, "out": "The fringe settles beautifully. He scores zero goals but wins 'Best Hair' in the dressing room."}, "b": {"label": "Make him run laps in a hat", "fx": {"squad": -10, "fans": 7}, "out": "He posts a black square on social media captioned 'no respect'. 4 million likes."}}, {"who": "ANGRY TV PUNDIT", "text": "I played for this club! In MY day we'd have run through a brick wall! This manager wouldn't run through a damp crisp packet!", "a": {"label": "Run through a brick wall live on air", "fx": {"press": 12, "fans": 8, "squad": -4}, "out": "You are concussed but trending. The wall has been offered a 5-year contract."}, "b": {"label": "Send him a fruit basket", "fx": {"press": -8, "board": 3}, "out": "He reviews the fruit basket on air. 'No leadership in that pineapple.'"}}, {"who": "KIT MAN", "text": "Boss, small issue. I washed the home kit with a red sock. Well. A blue sock. The kit is now sky blue.", "a": {"label": "Play in it. Colours are a mindset.", "fx": {"fans": -18, "press": 6}, "out": "The fans riot. A man in the stands eats his season ticket in protest."}, "b": {"label": "Play in bibs from the training bag", "fx": {"fans": -4, "squad": -5, "board": -4}, "out": "You play in orange bibs. The sponsor (a vape shop) demands a refund."}}, {"who": "STADIUM ENGINEER", "text": "The roof's leaking again. There's a waterfall in the east stand and a family of ducks has moved into the dugout.", "a": {"label": "Sign the ducks", "fx": {"fans": 10, "board": -6, "squad": 3}, "out": "Duck #2 completes more passes than your midfield. The fans have a song for him already."}, "b": {"label": "Ask the board to fix the roof", "fx": {"board": -10, "press": -4}, "out": "The board buys a second scoreboard instead. It also leaks."}}, {"who": "CLUB CAPTAIN", "text": "The lads have voted. We'd like the team talk delivered as a rap from now on.", "a": {"label": "Drop bars", "fx": {"squad": 10, "press": -10}, "out": "You rhyme 'press high' with 'nice try'. The video leaks. You are a meme in 40 countries."}, "b": {"label": "Read out the tactics in silence", "fx": {"squad": -9, "board": 4}, "out": "Three players fall asleep. One was already asleep."}}, {"who": "JOURNALIST", "text": "Gaffer, the fans are asking: do you actually have a philosophy, or is it just vibes?", "a": {"label": "\"It's a project.\"", "fx": {"press": -6, "board": 8, "fans": -6}, "out": "Nobody knows what the project is. Including you. The board nods approvingly."}, "b": {"label": "\"It's 100% vibes.\"", "fx": {"press": 9, "fans": 7, "board": -9}, "out": "'VIBESBALL' is on every back page. The board asks if vibes are tax deductible."}}, {"who": "HEAD OF RECRUITMENT", "text": "Found a wonderkid. 17 years old, 9 feet tall, possibly three kids in a bigger kid's shirt. Costs £80m.", "a": {"label": "Sign them. All of them.", "fx": {"board": -10, "squad": 9, "fans": 6}, "out": "He/they dominate in the air. The FA opens an investigation into how many of him there are."}, "b": {"label": "Too risky. Sign a 36-year-old.", "fx": {"squad": -5, "fans": -8, "board": 6}, "out": "Your new signing pulls a hamstring waving to the crowd at his unveiling."}}, {"who": "THE STATUE OUTSIDE THE GROUND", "text": "(It says nothing. But it is definitely looking at you. Disappointed.)", "a": {"label": "Stare back", "fx": {"press": -7, "fans": 5}, "out": "You lose the staring contest after six hours. Photos are everywhere."}, "b": {"label": "Put a traffic cone on its head", "fx": {"fans": -12, "squad": 8}, "out": "The lads think it's hilarious. The fans start a petition to have you deported to the moon."}}, {"who": "GOALKEEPER", "text": "Boss, I've been thinking. What if I just… didn't use my hands? Play out from the back, but with my face.", "a": {"label": "Bold. Do it.", "fx": {"squad": 4, "fans": -10, "press": 8}, "out": "He concedes four but his pass completion with the forehead is 91%. Analysts are in love."}, "b": {"label": "Please use your hands", "fx": {"squad": -6, "fans": 4}, "out": "He sulks and uses his hands sarcastically."}}, {"who": "FAN PROTEST GROUP", "text": "We're planning a protest before kick-off. Green and gold flares, a plane with a banner, the lot. You in?", "a": {"label": "Fly the plane yourself", "fx": {"fans": 16, "board": -18}, "out": "Your banner reads 'ME OUT'. The fans adore you. The board less so."}, "b": {"label": "Tell them to believe in the process", "fx": {"fans": -14, "board": 9}, "out": "The plane banner now has your face on it. It is not a flattering photo."}}, {"who": "NUTRITIONIST", "text": "The squad has discovered a chippy next to the training ground. Morale is up. Sprint speed is down 60%.", "a": {"label": "Ban the chippy", "fx": {"squad": -12, "press": 4, "board": 3}, "out": "Players are caught smuggling battered sausages in their shin pads."}, "b": {"label": "Make the chippy an official partner", "fx": {"squad": 9, "board": 7, "fans": 5, "press": -6}, "out": "New shirt sponsor: Big Kev's Plaice. The left back can no longer see his boots."}}, {"who": "DIRECTOR OF FOOTBALL", "text": "We've hired a Director of Football to oversee the Technical Director who manages the Sporting Director. They need you to fill in a form.", "a": {"label": "Fill in the form", "fx": {"board": 8, "squad": -5}, "out": "It takes nine days. You miss a match. Nobody notices."}, "b": {"label": "Eat the form", "fx": {"board": -11, "fans": 8, "press": 5}, "out": "'MANAGER EATS BUREAUCRACY' — your best headline yet."}}, {"who": "MIDFIELDER'S AGENT", "text": "My client is very happy here. He would be even happier with £500k a week and his own helicopter pad. Otherwise, he is sad.", "a": {"label": "Pay the man", "fx": {"board": -12, "squad": 7}, "out": "He signs. He immediately gets injured stepping out of the helicopter."}, "b": {"label": "Offer him a bus pass", "fx": {"squad": -10, "board": 6, "fans": 3}, "out": "He likes a cryptic post about 'loyalty'. Then he likes forty more."}}, {"who": "VAR OFFICIAL", "text": "After a 14-minute review we have ruled out your winning goal. Your striker's vibe was offside.", "a": {"label": "Accept it with dignity", "fx": {"fans": -8, "press": 6, "board": 3}, "out": "Dignity is not what the away end wanted. They wanted you to fight the monitor."}, "b": {"label": "Fight the monitor", "fx": {"fans": 13, "press": -8, "board": -7}, "out": "You lose to the monitor on points. Three-match touchline ban. Worth it."}}, {"who": "LEFT BACK", "text": "Gaffer I've started a podcast. Episode one is called 'Why The Manager Is Wrong About Everything'. You're the first guest!", "a": {"label": "Go on the podcast", "fx": {"press": 9, "squad": 4, "board": -6}, "out": "It goes well until he reads out the team's group chat about you. All of it."}, "b": {"label": "Fine him two weeks' wages", "fx": {"squad": -9, "board": 5}, "out": "Episode two is called 'Fined'. It charts at number one."}}, {"who": "GROUNDSMAN", "text": "Moles, boss. Hundreds. The pitch is more hole than pitch. They've unionised.", "a": {"label": "Negotiate with the moles", "fx": {"board": -6, "fans": 6, "press": 6}, "out": "The moles accept a draw. The centre circle is now a protected habitat."}, "b": {"label": "Play on. Use the holes tactically.", "fx": {"squad": -8, "fans": 5}, "out": "Your winger vanishes in the 60th minute. He emerges on Tuesday in the car park."}}, {"who": "SOCIAL MEDIA ADMIN", "text": "We lost 5-0 but I've got a great post ready: 'We go again!!'. Or we could just… post nothing?", "a": {"label": "We go again!!", "fx": {"fans": -11, "squad": 3}, "out": "63,000 replies. None of them printable."}, "b": {"label": "Post a photo of a sad dog", "fx": {"fans": 6, "press": 5, "board": -5}, "out": "The dog gets more engagement than the entire season. The board wants to sign the dog."}}, {"who": "LEGENDARY EX-PLAYER", "text": "I'm available to come back and help, you know. I'm only 51. Knees of a 90-year-old, heart of a lion.", "a": {"label": "Start him on Saturday", "fx": {"fans": 12, "squad": -8, "press": 5}, "out": "He lasts four minutes, gets a standing ovation, and is stretchered off waving."}, "b": {"label": "Give him a coaching badge and a whistle", "fx": {"squad": 5, "fans": 3, "board": -5}, "out": "He makes everyone do 1990s drills. Two players quit football to become plumbers."}}, {"who": "SPONSOR", "text": "We're a cryptocurrency called BloopCoin. We'd like to rename the stadium 'The BloopCoin Bowl of Dreams'.", "a": {"label": "Take the money", "fx": {"board": 15, "fans": -15}, "out": "BloopCoin collapses on Thursday. The sign stays up for three years."}, "b": {"label": "Tell them to bloop off", "fx": {"board": -12, "fans": 10}, "out": "The fans sing your name. The board sends you an invoice for £90m."}}, {"who": "CENTRE BACK", "text": "Boss, I know I scored three own goals, but technically that makes me our top scorer this month.", "a": {"label": "Play him up front", "fx": {"squad": 5, "fans": -6, "press": 7}, "out": "He scores at the correct end! By accident. He was trying to clear it."}, "b": {"label": "Bench him", "fx": {"squad": -7, "fans": 5}, "out": "His replacement scores four own goals. New club record."}}, {"who": "TEAM DOCTOR", "text": "Eleven players are out with 'general soreness'. I also have general soreness. Can I go home?", "a": {"label": "Everyone trains anyway", "fx": {"squad": -12, "board": 5, "fans": 3}, "out": "Now eighteen players have general soreness, and one has specific soreness."}, "b": {"label": "Spa day for all", "fx": {"squad": 11, "press": -8, "board": -5}, "out": "Paparazzi photo: your whole back four in cucumber eye masks. Day before a derby."}}, {"who": "RIVAL MANAGER", "text": "Lovely little club you've got here. Reminds me of us, twenty years ago, when we were bad.", "a": {"label": "Challenge him to a dance-off", "fx": {"press": 10, "fans": 6, "board": -6}, "out": "You do the worm on the touchline. You pull something. It was magnificent."}, "b": {"label": "Refuse the handshake", "fx": {"press": -6, "fans": 8, "squad": 3}, "out": "HANDSHAKE-GATE runs for eleven days. Body-language experts are consulted."}}, {"who": "YOUTH ACADEMY COACH", "text": "Our best academy kid is ready. He's 16, brilliant, and his mum says he has to be home by 8:30.", "a": {"label": "Start him. Evening kick-off.", "fx": {"fans": 12, "squad": 5, "press": 4, "board": -3}, "out": "He scores twice and is subbed at 8:10 so he can do his geography homework."}, "b": {"label": "Loan him to a team in the 9th tier", "fx": {"fans": -12, "board": 4}, "out": "He scores 60 goals there. A rival signs him. He scores against you. Twice."}}, {"who": "THE BOARD (3 men in 1 trenchcoat)", "text": "Pre-season tour idea: 9 friendlies in 11 days across 6 continents. For the brand.", "a": {"label": "For the brand!", "fx": {"board": 13, "squad": -14}, "out": "The squad returns with jet lag, sunburn and a lost goalkeeper (still in Perth)."}, "b": {"label": "A weekend in Blackpool instead", "fx": {"board": -10, "squad": 9, "fans": 4}, "out": "Team bonding is superb. Your striker wins a giant stuffed banana on the pier."}}, {"who": "TACTICS ANALYST", "text": "The data is clear. Statistically, our best formation is 0-0-10. Everyone up front. No defenders. Trust the laptop.", "a": {"label": "Trust the laptop", "fx": {"fans": 9, "squad": -6, "press": 8}, "out": "You lose 9-8. Neutrals call it the greatest game ever played."}, "b": {"label": "Close the laptop. 10-0-0.", "fx": {"fans": -13, "board": 5, "press": -5}, "out": "0-0. No shots. A fan in row G is found asleep the following morning."}}, {"who": "MASCOT", "text": "(The man in the mascot suit removes the head.) I've had enough. I want a transfer. Or at least a suit that doesn't smell.", "a": {"label": "Buy a new suit", "fx": {"board": -5, "fans": 6}, "out": "The new suit is terrifying. Children cry. Attendance in the family stand halves."}, "b": {"label": "Wear the suit yourself", "fx": {"fans": 10, "press": -9, "squad": 4}, "out": "You manage a full match as a large red devil-bear. You win. Nobody can explain it."}}, {"who": "WINGER", "text": "Boss, I've got a new celebration. It takes about four minutes and needs a ladder.", "a": {"label": "Approve the ladder", "fx": {"squad": 7, "fans": 6, "press": -4}, "out": "He scores, performs the full routine, and you concede twice while he's up the ladder."}, "b": {"label": "No ladders", "fx": {"squad": -8, "board": 3}, "out": "He stops scoring altogether, 'in protest', he says. He'd also stopped before."}}, {"who": "MYSTERIOUS BILLIONAIRE", "text": "I am considering buying 0.5% of the club. In exchange I pick the team on Saturdays. I have played a lot of video games.", "a": {"label": "Welcome aboard!", "fx": {"board": 10, "squad": -10, "fans": -4}, "out": "He plays the goalkeeper at striker 'because his shooting stat is underrated'."}, "b": {"label": "Pretend you didn't hear", "fx": {"board": -9, "fans": 6}, "out": "He buys the club's car park instead. Parking is now £400."}}, {"who": "DRESSING ROOM", "text": "Someone has leaked the team sheet again. The mole is one of: the captain, the chef, or you (you talk in your sleep).", "a": {"label": "Interrogate the chef", "fx": {"squad": 5, "press": -5}, "out": "The chef confesses to nothing but lunch is now very salty."}, "b": {"label": "Leak a fake team s const STATS=["fans","board","squad","press"], COL={fans:"#ffd21f",board:"#6ee07a",squad:"#6cc8ff",press:"#ff8fd0"};

let AC;function beep(f,d=.08,t="square",v=.05,when=0){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);
 const s=AC.currentTime+when;o.start(s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.stop(s+d)}catch(e){}}
const sfx={tap:()=>beep(520,.05),good:()=>{beep(660,.08);beep(880,.12,"square",.05,.08)},bad:()=>{beep(180,.18,"sawtooth",.06)},

/* ---------- UI plumbing ---------- */

 if(state=="play")$("#h2").textContent=`Week ${week} · Day ${days} in the job · Record: ${best} days`}

function apply(fx){const pr=1+week*.035;let hurt=false;for(const s in fx){let v=fx[s];if(v<0){v*=pr;hurt=true}v=Math.round(v);
  S[s]=Math.max(0,Math.min(100,S[s]+v));if(v){const e=$("#d-"+s);e.textContent=(v>0?"+":"")+v;e.style.color=v>0?"#7dff8a":"#ff6b5e";e.classList.remove("go");e.offsetHeight;e.classList.add("go")}}
 if(hurt){shake();sfx.bad()}else sfx.good();refresh()}
function sackReason(){for(const s of STATS)if(S[s]<=0)return D.SACK_LOW[s];for(const s of STATS)if(S[s]>=100)return D.SACK_HIGH[s];return ""}

 if(r<win){apply({fans:4,board:2});return `MATCHDAY: Won ${rnd(2,5)}-${rnd(0,1)} v ${opp}. ${pick(D.WIN)}`}
 if(r<win+.22){const g=rnd(0,3);apply({fans:-2});return `MATCHDAY: Drew ${g}-${g} v ${opp}. ${pick(D.DRAW)}`}
 apply({fans:-5,press:-4,board:-2});return `MATCHDAY: Lost ${rnd(0,1)}-${rnd(2,7)} v ${opp}. ${pick(D.LOSS)}`}
function finish(who,text,fx,match=true){apply(fx||{});let m="";if(match&&!sackReason())m=`<p class="match">${esc(playMatch())}</p>`;

 show(`<div class="card"><div class="who">${esc(who)}</div><p>${esc(text)}</p>${m}</div><button class="btn" id="nx">${dead?"UH OH…":"NEXT WEEK ▶"}</button>`);

let deck=[],bag=[],firstTransfer=true;

 if(week==1)g=gFormation;else if(week==3)g=gTransfer;
 else if(week%2==0)g=gCard;
 else{if(!bag.length)bag=shuffle(GAMES);g=bag.pop()}
 g()}

 if(rec){best=days;try{localStorage.setItem("manu_best",best)}catch(e){}}
 sfx.sack();shake();$("#h1").textContent="SACKED!";$("#h2").textContent=`You lasted ${days} days (${week} weeks)`;

 const fix=(only)=>{if(locked||!pt.isConnected)return;const defs=P.map((p,i)=>[p[1],i]).filter(d=>d[0]>66).sort((a,b)=>b[0]-a[0]);if(defs.length<=2)return;

/* ---------- 4. press conference: the sensible answer runs away ---------- */
const PRESS=[
 {q:"Gaffer, you just lost 4-0 to a team of part-time postmen. Your thoughts?",s:"We'll analyse it calmly and improve.",
  d:[["The postmen had inside information.",{press:8,fans:4,board:-6},"ROYAL FAIL: MANAGER BLAMES POSTIES. The postmen's union demands an apology. They deliver it to the wrong address."],
     ["I actually thought we won.",{press:-9,squad:5,fans:-4},"You are shown the scoreboard. You ask to see 'a different scoreboard'."]]},
 {q:"Is it true you've lost the dressing room?",s:"No. The group is united.",
  d:[["I know exactly where it is. Second door on the left.",{press:7,squad:-5,fans:5},"It was not the second door on the left. That was a cupboard. You gave the team talk to a mop."],
     ["The dressing room has lost ME.",{press:9,squad:-8,board:-4},"Deep. Too deep. Three philosophy podcasts want you. The squad want you gone."]]},
 {q:"What's your message to the fans tonight?",s:"Stick with us. We're working hard.",
  d:[["Have you tried supporting someone else?",{fans:-15,press:10},"The clip has 40 million views. A man burns his season ticket on live TV. It was a library card. Still."],
     ["Refunds are available from the board.",{fans:13,board:-15},"A queue of 70,000 forms outside the directors' entrance. The trenchcoat is furious."]]},
 {q:"Your striker hasn't scored in 19 games. Is he undroppable?",s:"Every place is earned in training.",
  d:[["He's scoring loads in my heart.",{squad:7,fans:-8,press:5},"He celebrates by not scoring again. Game 20."],
     ["Goals are an outdated metric.",{press:8,fans:-7,board:4},"The analytics community hails you as a visionary. The league table does not."]]}];
let pressBag=[];
function gPress(){if(!pressBag.length)pressBag=shuffle(PRESS);const p=pressBag.pop();
 const opts=shuffle([["s",p.s],["0",p.d[0][0]],["1",p.d[1][0]]]);
 show(`<div class="card"><div class="who">📸 Press conference</div><p class="q">${esc(p.q)}</p></div><div class="ans" id="an">
 ${opts.map(o=>o[0]=="s"?`<button class="btn g sens" id="se">${esc(o[1])}</button>`:`<button class="btn w" data-k="${o[0]}">${esc(o[1])}</button>`).join("")}</div>`);
 const an=$("#an"),se=$("#se");let n=0;
 const quips=["Nope. Your mouth refuses.","The sensible answer has left the building.","You physically cannot say it."];
 se.onpointerdown=e=>{if(n>=3)return;e.preventDefault();n++;sfx.bad();toast(quips[n-1],1300);
  const kids=[...an.children].filter(c=>c!=se);an.insertBefore(se,pick([...kids,null].filter(k=>k!=se.nextSibling)));
  se.style.transform=`scale(${1-n*.12})`;se.classList.remove("wig");se.offsetHeight;se.classList.add("wig");
  if(n==3){se.style.transform="";se.className="btn sens";se.textContent="NO COMMENT (leg it)";
   setTimeout(()=>se.onclick=()=>finish("Press conference","You sprint out of the room mid-question. You take the microphone with you by accident. And the tablecloth.",{press:-7,fans:4}),250)}};
 an.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const d=p.d[+b.dataset.k];finish("Tomorrow's back page",d[2],d[1])})}

/* ---------- 5. substitution: the board has its own ideas ---------- */
function gSub(){const sq=[["9","Star Striker",88],["47","The Academy Kid",84],["4","Club Captain",79],["3","Left Back (podcaster)",61],["5","Centre Back (own goals)",38]];
 show(`<div class="card slim"><div class="who">70th minute · 0-0</div><p>Fresh legs needed. Who's coming off?</p></div>
 ${sq.map((p,i)=>`<div class="pl" data-i="${i}"><b>${p[0]}</b>${p[1]} · ${p[2]}<span>TAKE OFF</span></div>`).join("")}`);
 panel.querySelectorAll(".pl").forEach(el=>el.onclick=async()=>{const me=sq[+el.dataset.i];sfx.tap();
  const outs=[["9","KIT MAN","The fourth official's board says 9. That's your Star Striker. \"Board's final, mate.\" On comes the kit man, still holding a bag of bibs.",{squad:-8,fans:-6,press:6}],
   ["1","NOBODY","The board says 1. Your goalkeeper trudges off. There is no sub keeper. Your winger goes in goal wearing oven gloves.",{fans:-7,press:8,squad:-4}],
   ["88","A STEWARD","The board malfunctions and shows 88. Nobody is number 88. A steward shrugs, takes off his hi-vis and comes on. Man of the match.",{fans:9,press:7,board:-5}],
   ["47","HIS DAD","The board says 47. The Academy Kid is replaced by his dad, who has 'always fancied a go'. Dad pulls a hamstring during the handshake.",{fans:-5,squad:-5,press:7}]];
  let o=pick(outs.filter(x=>x[0]!=me[0]));
  show(`<div class="card"><div class="who">You asked for number ${me[0]} off</div><div class="led" id="led">${me[0]}<small>ON: —</small></div><p id="lt">Fourth official is typing it in…</p></div>`);
  for(let i=0;i<9;i++){await wait(130);if(!$("#led"))return;$("#led").firstChild.textContent=rnd(1,99);beep(300+i*40,.04)}
  $("#led").innerHTML=`${o[0]}<small>ON: ${o[1]}</small>`;$("#lt").textContent="…that's not what you asked for.";shake();sfx.bad();await wait(1500);if(!$("#led"))return;
  finish("Substitution",o[2],o[3])})}

/* ---------- 6. VAR: draw the line wherever you like. It won't matter. ---------- */
function gVar(){const why=pick([["his fringe","The fringe was 4mm beyond the last defender. Rules are rules."],["his vibe","His body was level. His vibe had gone early."],
  ["his shadow","His shadow was offside. It's a new directive. Nobody told you."],["his dad (1994)","VAR found his dad was offside in a Sunday League game in 1994. It carries over."]]);
 show(`<div class="card slim"><div class="who">📺 VAR check · 89th minute winner</div><p>Great news: they're letting <b>you</b> draw the offside line. Drag it.</p></div>
 <div class="var"><div class="m df" id="df" style="left:62%"><div class="tag" style="color:#6cc8ff">DEFENDER</div></div><div class="m at" id="at" style="left:50%"><div class="tag" style="color:#ff8f8f">YOUR LAD</div></div><div class="ln" id="ln" style="left:70%"></div></div>
 <input type="range" id="sl" min="5" max="95" value="70"><button class="btn" id="ok">CHECK COMPLETE ✔</button>`);
 const sl=$("#sl"),ln=$("#ln"),df=$("#df"),at=$("#at");
 sl.oninput=()=>{const v=+sl.value;ln.style.left=v+"%";at.style.left=Math.min(95,v+6)+"%";df.style.left=Math.max(5,v-5)+"%"};
 $("#ok").onclick=async e=>{e.target.disabled=true;sl.disabled=true;toast("VAR: 'Just having another look…'",1500);await wait(1400);if(!ln.isConnected)return;
  ln.classList.add("auto");ln.style.left=(parseFloat(at.style.left)-3.5)+"%";await wait(1300);if(!ln.isConnected)return;toast("🚫 OFFSIDE: "+why[0].toUpperCase(),1500);shake();sfx.bad();await wait(1500);
  finish("VAR decision",`Goal disallowed after an 11-minute review. ${why[1]} Wherever you put the line, your lad politely stepped past it. Final score: 0-0.`,pick([{fans:-7,press:5},{fans:-5,squad:-5,board:-3},{fans:6,press:-6,board:-4}]),false)}}

/* ---------- 7. team talk: hit the green. (You won't.) ---------- */
function gTalk(){show(`<div class="card slim"><div class="who">Half-time team talk · 0-2 down</div><p>Find the right level of passion. Stop the needle in the <b style="color:#1e9e44">green</b>.</p></div>
 <div class="lab"><span>😴 WHISPER</span><span>JUST RIGHT</span><span>TEA URN 🫖</span></div><div class="meter"><div class="zn" id="zn" style="left:42%;width:16%"></div><div class="nd" id="nd"></div></div>
 <button class="btn" id="st">STOP! ✋</button>`);
 const nd=$("#nd"),zn=$("#zn");let x=0,dir=1,live=true,last=performance.now();
 (function loop(t){if(!live||!nd.isConnected)return;x+=dir*(t-last)*.17;last=t;if(x>100){x=100;dir=-1}if(x<0){x=0;dir=1}nd.style.left=x+"%";requestAnimationFrame(loop)})(last);
 $("#st").onclick=()=>{live=false;const zl=parseFloat(zn.style.left);if(x>zl-2&&x<zl+18){zn.style.left=(x<50?x+12:x-28)+"%";toast("The green bit moved. Honest.",1400)}
  setTimeout(()=>{if(!nd.isConnected)return;x<50?finish("Team talk","You whispered. So gently that three players fell asleep and the physio tucked them in. One of them is still there.",{squad:-7,press:4,fans:-3})
   :finish("Team talk","You booted the tea urn. It was full. It was the kit man's. It was his grandmother's. Two players are now 'unavailable due to tea'.",{squad:-6,fans:7,board:-5})},1100)}}
const GAMES=[gFormation,gTransfer,gPress,gSub,gVar,gTalk];

/* ---------- the gaffer (canvas) ---------- */
const cv=$("#face"),cx=cv.getContext("2d");let shock=0,T=0,lastT=0;
function mix(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t))}
function drawFace(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;T+=dt;shock=Math.max(0,shock-dt*1.5);
 const dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;if(cv.width!=w*dpr||cv.height!=h*dpr){cv.width=w*dpr;cv.height=h*dpr}
 cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,w,h);cx.lineCap="round";
 const m=mood(),st=1-m,bald=state=="title"?0:Math.min(1,week/22),r=h*.34,j=st*2+shock*10;
 const X=w/2+(Math.random()*2-1)*j,Y=h*.44+Math.sin(T*2)*3+(Math.random()*2-1)*j,ink="#1a1010";
 const circ=(x,y,rr,c)=>{cx.fillStyle=c;cx.beginPath();cx.arc(x,y,rr,0,7);cx.fill()};
 const line=(a,b,c,d,wd,col)=>{cx.strokeStyle=col||ink;cx.lineWidth=wd;cx.beginPath();cx.moveTo(a,b);cx.lineTo(c,d);cx.stroke()};
 const sy=Y+r*.95;cx.fillStyle="#22222c";cx.beginPath();cx.moveTo(X-r*1.6,h);cx.lineTo(X-r*.9,sy);cx.lineTo(X+r*.9,sy);cx.lineTo(X+r*1.6,h);cx.fill();
 cx.fillStyle="#fff";cx.beginPath();cx.moveTo(X-r*.3,sy);cx.lineTo(X+r*.3,sy);cx.lineTo(X,sy+r*.6);cx.fill();
 for(let i=0;i<6;i++){cx.fillStyle=i%2?"#ffd21f":"#d81e1e";cx.fillRect(X-r*.75+i*r*.25,sy-r*.12,r*.25,r*.26)}
 cx.fillStyle="#d81e1e";cx.fillRect(X+r*.35,sy,r*.24,r*.7+Math.sin(T*3)*3);
 const skin="rgb("+mix([242,201,160],[226,84,63],Math.max(0,Math.min(1,st*1.2-.2)))+")";
 circ(X-r,Y,r*.2,skin);circ(X+r,Y,r*.2,skin);circ(X,Y,r,skin);
 const n=Math.round(17*(1-bald));for(let i=0;i<n;i++){const a=(-160+140*((i*7%17)/16))*Math.PI/180,wb=Math.sin(T*3+i)*.25*(.3+st),L=r*(.38+.1*Math.sin(i*1.7));
  line(X+Math.cos(a)*r*.95,Y+Math.sin(a)*r*.95,X+Math.cos(a)*r*.95+Math.cos(a+wb)*L,Y+Math.sin(a)*r*.95+Math.sin(a+wb)*L,4,"#4a3020")}
 const er=r*(.2+.1*st),ey=Y-r*.15;for(const s of[-1,1]){const exx=X+s*r*.38;
  if(bald>.35){cx.strokeStyle="rgba(80,30,80,.45)";cx.lineWidth=3;cx.beginPath();cx.arc(exx,ey+er*.5,er,.2,Math.PI-.2);cx.stroke()}
  circ(exx,ey,er,"#fff");circ(exx+Math.sin(T*1.3+s)*er*.3+(Math.random()*2-1)*st*2,ey+Math.cos(T*.9)*er*.3+(Math.random()*2-1)*st*2,er*(.42-.22*st),ink);
  const tl=(-.25+.8*st)*s,by=ey-er*1.45,dx=Math.cos(tl)*er*1.1,dy=Math.sin(tl)*er*1.1;line(exx-dx,by-dy,exx+dx,by+dy,5)}
 const my=Y+r*.45,mw=r*.42;cx.strokeStyle=ink;cx.lineWidth=4.5;cx.beginPath();
 if(m>.58){cx.arc(X,my-mw*.5,mw,.2*Math.PI,.8*Math.PI);cx.stroke()}else if(m>.4){cx.moveTo(X-mw*.8,my+Math.sin(T*6)*2);cx.lineTo(X+mw*.8,my-Math.sin(T*6)*2);cx.stroke()}
 else if(m>.2){cx.arc(X,my+mw*.9,mw,1.2*Math.PI,1.8*Math.PI);cx.stroke()}else{circ(X,my,mw*(.55+.1*Math.sin(T*14)),ink);circ(X,my+mw*.25,mw*.25,"#c0392b")}
 for(let i=0;i<Math.floor(st*6);i++){const ph=(T*.9+i*.37)%1,sx=X+(r*.8+(i%3)*9)*(i%2?-1:1),py=Y-r*.7+ph*r*1.3;cx.globalAlpha=1-ph;circ(sx,py,4,"#73ccff");
  cx.beginPath();cx.moveTo(sx-3.5,py-1.5);cx.lineTo(sx+3.5,py-1.5);cx.lineTo(sx,py-10);cx.fill();cx.globalAlpha=1}
 requestAnimationFrame(drawFace)}
requestAnimationFrame(drawFace);
document.addEventListener("touchmove",e=>{if(!e.target.closest("#panel")||e.target.closest(".pitch"))e.preventDefault()},{passive:false});
title();
</script>
</body>
